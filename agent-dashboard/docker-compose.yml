services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: agent_dashboard
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d agent_dashboard"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://app:password@postgres:5432/agent_dashboard
      READONLY_DATABASE_URL: postgresql+asyncpg://app:password@postgres:5432/agent_dashboard
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      AIRFLOW_API_URL: http://airflow-webserver:8080/api/v1
      AIRFLOW_USERNAME: airflow
      AIRFLOW_PASSWORD: airflow
    volumes:
      - ./artifacts:/app/artifacts
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  airflow-init:
    build:
      context: ./airflow
    entrypoint: bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username airflow --password airflow --firstname Airflow --lastname Admin --role Admin --email airflow@example.com || true
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://app:password@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: 46BKJoQYlPPOexvfa1HDWQXB_T6pEYA33c9W2A2D4o4=
      AIRFLOW__WEBSERVER__SECRET_KEY: 46BKJoQYlPPOexvfa1HDWQXB_T6pEYA33c9W2A2D4o4=
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    build:
      context: ./airflow
    command: airflow webserver
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://app:password@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: 46BKJoQYlPPOexvfa1HDWQXB_T6pEYA33c9W2A2D4o4=
      AIRFLOW__WEBSERVER__SECRET_KEY: 46BKJoQYlPPOexvfa1HDWQXB_T6pEYA33c9W2A2D4o4=
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt

  airflow-scheduler:
    build:
      context: ./airflow
    command: airflow scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://app:password@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: 46BKJoQYlPPOexvfa1HDWQXB_T6pEYA33c9W2A2D4o4=
      AIRFLOW__WEBSERVER__SECRET_KEY: 46BKJoQYlPPOexvfa1HDWQXB_T6pEYA33c9W2A2D4o4=
      DBT_POSTGRES_HOST: postgres
      DBT_POSTGRES_PORT: 5432
      DBT_POSTGRES_USER: app
      DBT_POSTGRES_PASSWORD: password
      DBT_POSTGRES_DATABASE: agent_dashboard
      BACKEND_TRAIN_URL: http://api:8000/api/forecast/train
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - ./artifacts:/opt/airflow/artifacts

volumes:
  postgres_data:
  minio_data:
